name: Update profile technologies card

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Build technologies card
        run: python scripts/update_technologies.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- tecnologias.svg; then
            echo "Card already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tecnologias.svg
          git commit -m "Update profile technologies card"
          git push
